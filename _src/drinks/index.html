/* Menu de drinks — mesma identidade do Além da Urna (tinta, verde-limão, Fraunces / Inter / Plex Mono).
   Pensado para iPad em pé ou deitado, com alvos de toque grandes. */
:root {
  --ink: #0b0b0b; --ink-2: #121413; --ink-3: #1b1d1c; --line: rgba(255,255,255,.1);

  --f-display: "Fraunces", Georgia, serif; --f-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --pad: max(16px, env(safe-area-inset-left, 0px)); --padr: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; min-height: 100svh; background: var(--ink); color: var(--t); font-family: var(--f-sans); font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased; touch-action: manipulation; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
h1, h2, h3, p, ol, ul { margin: 0; }
ol, ul { padding: 0; list-style: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 var(--padr) 0 var(--pad); }

/* topo */
.top { position: sticky; top: 0; z-index: 5; background: rgba(11,12,15,.92); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.top .wrap { display: flex; align-items: center; gap: 12px; min-height: 64px; }
.brand { display: grid; line-height: 1.15; flex: 1; min-width: 0; }
.brand img { display: block; height: 28px; width: auto; max-width: none; margin-bottom: 4px; }
.brand small { font-family: var(--f-mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.back { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 18px 0 14px; border-radius: 99px; background: var(--ink-3); border: 1px solid var(--line); font-weight: 600; font-size: 16px; }
.back:active { transform: scale(.97); }
.lang { display: flex; border: 1px solid var(--line); border-radius: 99px; padding: 3px; }
.lang button { min-width: 44px; min-height: 40px; border-radius: 99px; font-family: var(--f-mono); font-size: 13px; font-weight: 600; color: var(--t2); }
.lang button[aria-pressed="true"] { background: var(--t); color: var(--ink); }
.offline { display: none; font-family: var(--f-mono); font-size: 11px; color: var(--t2); border: 1px solid var(--line); border-radius: 99px; padding: 4px 10px; }
body.is-offline .offline { display: inline-block; }

/* lista */
.intro { padding: 28px 0 8px; display: grid; gap: 6px; }
.intro h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(36px, 6vw, 60px); line-height: .95; letter-spacing: -.03em; }
.intro p { color: var(--t2); font-size: 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; padding: 20px 0 28px; }
.card { position: relative; display: grid; grid-template-columns: 64px 1fr auto; gap: 16px; align-items: center; min-height: 112px; padding: 18px 18px 18px 16px; border-radius: 18px; background: var(--ink-2); border: 1px solid var(--line); text-align: left; overflow: hidden; transition: transform .15s, border-color .2s; }
.card::after { content: ""; position: absolute; inset: auto -30% -60% auto; width: 70%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--c) 30%, transparent), transparent 65%); pointer-events: none; }
.card:active { transform: scale(.98); border-color: var(--c); }
.card h2 { font-family: var(--f-display); font-weight: 700; font-size: 25px; line-height: 1.05; letter-spacing: -.01em; }
.card p { margin-top: 6px; font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--t2); }
.card .go { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--ink-3); color: var(--c); font-size: 20px; }
.glass { width: 64px; height: 64px; display: block; }
.glass .liq { fill: var(--c); } .glass .rim { fill: none; stroke: rgba(255,255,255,.55); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.glass .ice { fill: rgba(255,255,255,.35); } .glass .gar { fill: var(--g, #c6f24e); }
.note-global { color: var(--t2); font-size: 15px; padding: 0 0 12px; }
.note-global b { color: var(--t); font-weight: 600; }

/* receita */
.recipe { padding: 18px 0 40px; display: grid; gap: 20px; }
.r-head { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.r-head .glass { width: 96px; height: 96px; }
.r-head h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(38px, 7vw, 66px); line-height: .95; letter-spacing: -.03em; }
.r-head p { margin-top: 8px; font-family: var(--f-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--c); }
.controls { position: sticky; top: calc(65px + env(safe-area-inset-top, 0px)); z-index: 4; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 12px 0; background: var(--ink); }
.ctl-l { font-family: var(--f-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--t2); }
.seg { display: inline-flex; background: var(--ink-3); border: 1px solid var(--line); border-radius: 16px; padding: 4px; gap: 4px; }
.seg button { min-width: 78px; min-height: 56px; padding: 0 16px; border-radius: 12px; font-weight: 600; font-size: 20px; color: var(--t2); font-variant-numeric: tabular-nums; }

.seg button[aria-pressed="true"] { background: var(--accent); color: var(--ink); }
.cols { display: grid; gap: 20px; }
@media (min-width: 820px) { .cols { grid-template-columns: 1.1fr 1fr; align-items: start; } }
.panel { background: var(--ink-2); border: 1px solid var(--line); border-radius: 20px; padding: 6px 20px 14px; }
.panel h3 { font-family: var(--f-mono); font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--t2); padding: 16px 0 6px; }
.ing li { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: baseline; padding: 14px 0; border-bottom: 1px solid var(--line); }
.ing li:last-child { border-bottom: 0; }
.ing .nm { font-size: 19px; font-weight: 500; }
.ing .nm small { display: block; font-size: 13.5px; color: var(--t2); font-weight: 400; margin-top: 2px; }
.ing .qt { font-family: var(--f-mono); font-weight: 600; font-size: 24px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--t); }
.ing .qt small { font-size: 14px; color: var(--t2); margin-left: 3px; font-weight: 500; }
.ing .qt.txt { font-family: var(--f-sans); font-size: 17px; font-weight: 500; white-space: normal; max-width: 16ch; }
.ing li.opt .nm::after { content: attr(data-opt); display: inline-block; margin-left: 8px; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--t2); border: 1px solid var(--line); border-radius: 99px; padding: 2px 8px; vertical-align: 3px; }
.ing li.ice .qt { color: #a9d8ff; }
.ing li.fin .qt { color: var(--c); }
.flash .qt { animation: pop .35s ease; }
@keyframes pop { 0% { transform: scale(1.12); color: var(--accent); } 100% { transform: none; } }
.steps { counter-reset: s; }
.steps li { position: relative; padding: 13px 0 13px 52px; font-size: 18px; border-bottom: 1px solid var(--line); }
.steps li:last-child { border-bottom: 0; }
.steps li::before { counter-increment: s; content: counter(s); position: absolute; left: 0; top: 10px; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--ink-3); border: 1px solid var(--line); font-family: var(--f-mono); font-weight: 600; font-size: 15px; color: var(--c); }
.tip { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: rgba(198,242,78,.07); border: 1px solid rgba(198,242,78,.25); font-size: 15px; }
.tip b { color: var(--accent); }
.batch { margin-top: 10px; font-size: 14.5px; color: var(--t2); }
.foot { padding: 18px 0 calc(24px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); color: var(--t2); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .flash .qt { animation: none; } .card, .back { transition: none; } }
</style>

  var store = { get: function (k) { try { return localStorage.getItem("drinks." + k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem("drinks." + k, v); } catch (e) {} } };
  var LANG = store.get("lang") || "pt";
  if (/[?&]lang=en/.test(location.search)) LANG = "en"; if (/[?&]lang=pt/.test(location.search)) LANG = "pt";
  var N = +(store.get("n") || 1); if ([1, 2, 4].indexOf(N) < 0) N = 1;
  var VAR = store.get("pina") || "rum";
  var main = document.getElementById("main");

  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function md(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"); }
  function num(x) { var r = Math.round(x * 100) / 100; return LANG === "en" ? String(r) : String(r).replace(".", ","); }
  function unit(u, v) { var U = UNITS[u][LANG]; return v > 1 ? U[1] : U[0]; }
  function qty(it, n) {
    if (it.q == null) return null;
    var a = Array.isArray(it.q) ? it.q[0] * n : it.q * n, b = Array.isArray(it.q) ? it.q[1] * n : null;
    var v = (b != null ? num(a) + "–" + num(b) : num(a));
    return { v: (it.approx ? "≈ " : "") + v, u: unit(it.u, b != null ? b : a) };
  }
  function T(k) { return UI[LANG][k]; }

  /* copos desenhados (cor = cor do drink) */
  function glass(type, c, g) {
    var s = { mug: '<path class="liq" d="M16 24h30v28a6 6 0 0 1-6 6H22a6 6 0 0 1-6-6z" opacity=".9"/><rect class="ice" x="20" y="27" width="9" height="9" rx="2"/><rect class="ice" x="31" y="31" width="9" height="9" rx="2"/><path class="rim" d="M14 18h34v34a8 8 0 0 1-8 8H22a8 8 0 0 1-8-8zM48 26h4a6 6 0 0 1 6 6v6a6 6 0 0 1-6 6h-4"/><circle class="gar" cx="44" cy="17" r="5"/>',
      hurricane: '<path class="liq" d="M22 22h20c0 9-4 12-4 18s3 8 3 12H23c0-4 3-6 3-12s-4-9-4-18z" opacity=".95"/><path class="rim" d="M20 10h24c0 12-5 16-5 24s4 11 4 18H21c0-7 4-10 4-18s-5-12-5-24zM32 52v8M24 60h16"/><circle class="gar" cx="42" cy="12" r="6"/>',
      martini: '<path class="liq" d="M16 18h32L32 34z" opacity=".95"/><path class="rim" d="M12 12h40L32 36zM32 36v20M22 58h20"/><circle class="gar" cx="28" cy="20" r="2"/><circle class="gar" cx="32" cy="21" r="2"/><circle class="gar" cx="36" cy="20" r="2"/>',
      highball: '<path class="liq" d="M20 22h24v34a3 3 0 0 1-3 3H23a3 3 0 0 1-3-3z" opacity=".9"/><rect class="ice" x="23" y="26" width="8" height="8" rx="2"/><rect class="ice" x="32" y="33" width="8" height="8" rx="2"/><rect class="ice" x="24" y="41" width="8" height="8" rx="2"/><path class="rim" d="M18 8h28v49a4 4 0 0 1-4 4H22a4 4 0 0 1-4-4z"/><path class="gar" d="M40 4a8 8 0 0 1 8 8h-8z"/>',
      coupe: '<path class="liq" d="M15 20h34c-1 8-8 13-17 13s-16-5-17-13z" opacity=".95"/><path class="rim" d="M12 16h40c0 11-9 19-20 19S12 27 12 16zM32 35v20M22 58h20"/><path class="gar" d="M46 12a6 6 0 0 1 6 6h-6z"/>' }[type];
    return '<svg class="glass" viewBox="0 0 64 64" aria-hidden="true" style="--c:' + c + ";--g:" + g + '">' + s + "</svg>";
  }

  /* ---------------------------------------------------------------- telas */
  function chrome(inRecipe) {
    document.documentElement.lang = LANG === "en" ? "en" : "pt-BR";
    document.getElementById("brand-s").textContent = T("brand_s");
    document.getElementById("back").hidden = !inRecipe;
    document.getElementById("back-t").textContent = T("back");
    document.getElementById("brand").hidden = !!inRecipe && window.innerWidth < 520;
    document.getElementById("off").textContent = T("offline");
    document.getElementById("foot-l").textContent = T("foot_l");
    document.getElementById("foot-r").textContent = T("foot_r");
    [].forEach.call(document.querySelectorAll("[data-lang]"), function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-lang") === LANG); });
  }
  function renderList() {
    chrome(false);
    document.title = (LANG === "en" ? "Drinks menu" : "Menu de drinks") + " — Além da Urna";
    main.innerHTML = '<div class="intro"><h1>' + esc(T("title")) + "</h1><p>" + esc(T("sub")) + '</p></div><div class="grid">' +
      DRINKS.map(function (d) {
        return '<button class="card" type="button" data-open="' + d.id + '" style="--c:' + d.c + '">' + glass(d.glass, d.c, d.g) + "<span><h2>" + esc(d[LANG].name) + "</h2><p>" + esc(d[LANG].tag) + '</p></span><span class="go" aria-hidden="true">→</span></button>';
      }).join("") + '</div><p class="note-global">' + md(T("syrup")) + "</p>";
    window.scrollTo(0, 0);
  }
  function renderRecipe(id, flash) {
    var d = DRINKS.filter(function (x) { return x.id === id; })[0]; if (!d) return renderList();
    chrome(true);
    document.title = d[LANG].name + " — " + (LANG === "en" ? "Drinks" : "Drinks");
    var vr = d.variants ? (d.variants.filter(function (v) { return v.id === VAR; })[0] || d.variants[0]) : null;
    var rows = { ing: [], ice: [], fin: [] };
    d.items.forEach(function (it0) {
      var it = it0.base ? vr.base : it0, kind = it0.kind || "ing";
      var label = esc(it[LANG] || ""), note = it[LANG + "_n"] ? "<small>" + esc(it[LANG + "_n"]) + "</small>" : "", q;
      if (kind === "ice") {
        if (it.plenty) q = '<span class="qt txt">' + esc(it.shake ? T("plenty_shake") : T("plenty")) + "</span>";
        else { var qq = qty(it, N); q = '<span class="qt">' + qq.v + "<small>" + esc(qq.u) + "</small></span>"; }
        rows.ice.push('<li class="ice"><span class="nm">' + esc(T("ice")) + '</span>' + q + "</li>");
        return;
      }
      if (it.txt) q = '<span class="qt txt">' + esc(it.txt[LANG]) + "</span>";
      else { var x = qty(it, N); q = '<span class="qt">' + x.v + "<small>" + esc(x.u) + "</small></span>"; if (it.per && N > 1) note = "<small>" + esc(num(it.q) + " " + unit(it.u, it.q) + " " + T("per")) + "</small>"; }
      rows[kind].push("<li" + (it.opt || it0.opt ? ' class="opt' + (kind === "fin" ? " fin" : "") + '" data-opt="' + esc(T("optional")) + '"' : kind === "fin" ? ' class="fin"' : "") + '><span class="nm">' + label + note + "</span>" + q + "</li>");
    });
    var h = '<div class="recipe" style="--c:' + d.c + '"><div class="r-head">' + glass(d.glass, d.c, d.g) + "<div><h1>" + esc(d[LANG].name) + "</h1><p>" + esc(d[LANG].tag) + "</p></div></div>" +
      '<div class="controls"><span class="ctl-l">' + esc(T("for")) + '</span><div class="seg" role="group" aria-label="' + esc(T("for")) + '">' +
      [1, 2, 4].map(function (n) { return '<button type="button" data-n="' + n + '" aria-pressed="' + (n === N) + '">' + n + "<small>" + esc(n === 1 ? T("drinks1") : T("drinksN")) + "</small></button>"; }).join("") + "</div>" +
      (d.variants ? '<span class="ctl-l">' + esc(T("spirit")) + '</span><div class="seg" role="group" aria-label="' + esc(T("spirit")) + '">' + d.variants.map(function (v) { return '<button type="button" data-var="' + v.id + '" aria-pressed="' + (v.id === vr.id) + '">' + esc(v[LANG]) + "</button>"; }).join("") + "</div>" : "") + "</div>" +
      '<div class="cols' + (flash ? " flash" : "") + '"><section class="panel"><h3>' + esc(T("ing")) + '</h3><ul class="ing">' + rows.ing.join("") + rows.ice.join("") + "</ul>" +
      (rows.fin.length ? "<h3>" + esc(T("fin")) + '</h3><ul class="ing">' + rows.fin.join("") + "</ul>" : "") + "</section>" +
      '<section class="panel"><h3>' + esc(T("steps")) + '</h3><ol class="steps">' + d.steps[LANG].map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ol>" +
      (d.tip ? '<p class="tip">' + esc(d.tip[LANG]) + "</p>" : "") + (d.syrup ? '<p class="tip">' + md(T("syrup")) + "</p>" : "") +
      (N === 4 && d.shake ? '<p class="batch">' + esc(T("batch_shake")) + "</p>" : "") + (N === 4 && d.blend ? '<p class="batch">' + esc(T("batch_blend")) + "</p>" : "") + "</section></div></div>";
    main.innerHTML = h;
  }
  function route(flash) {
    var id = location.hash.replace(/^#/, "");
    if (id) renderRecipe(id, flash); else renderList();
  }

  /* ---------------------------------------------------------------- toque */
  document.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target : null; if (!t) return; var el;
    if ((el = t.closest("[data-open]"))) { location.hash = el.getAttribute("data-open"); window.scrollTo(0, 0); return; }
    if (t.closest("#back")) { history.replaceState(null, "", location.pathname + location.search); route(false); window.scrollTo(0, 0); return; }
    if ((el = t.closest("[data-n]"))) { N = +el.getAttribute("data-n"); store.set("n", N); var y = window.scrollY; route(true); window.scrollTo(0, y); return; }
    if ((el = t.closest("[data-var]"))) { VAR = el.getAttribute("data-var"); store.set("pina", VAR); var y2 = window.scrollY; route(true); window.scrollTo(0, y2); return; }
    if ((el = t.closest("[data-lang]"))) { LANG = el.getAttribute("data-lang"); store.set("lang", LANG); route(false); return; }
  });
  window.addEventListener("hashchange", function () { route(false); window.scrollTo(0, 0); });
  function net() { document.body.classList.toggle("is-offline", !navigator.onLine); }
  window.addEventListener("online", net); window.addEventListener("offline", net); net();
  route(false);

  /* ---------------------------------------------------------------- offline (service worker só desta página) */
  if ("serviceWorker" in navigator && window.isSecureContext) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(function () {}); });
  }
})();
</script>
</body>
</html>
